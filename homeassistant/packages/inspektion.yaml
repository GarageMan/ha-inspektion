# Home-Assistant-Package für die App/das Add-on "Motorrad-Inspektionen"
# Ablage:  /homeassistant/packages/inspektion.yaml   (Samba: \\homeassistant.local\config\packages\)
# Voraussetzung in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# ANPASSEN (einmalig):
#   ADDON_SLUG → interner Name der App aus der Adresszeile, z. B. 96452f41_inspektion
#               (…/config/app/96452f41_inspektion/info)
# Benachrichtigungen landen in der Glocke "Benachrichtigungen" (persistent_notification).
# Mit Companion-App aufs Handy: zusätzlich eine Aktion notify.mobile_app_<gerät> ergänzen.

input_number:
  ktm_kilometerstand:
    name: KTM Kilometerstand
    min: 0
    max: 200000
    step: 1
    mode: box
    unit_of_measurement: km
    icon: mdi:counter
  husqvarna_kilometerstand:
    name: Husqvarna Kilometerstand
    min: 0
    max: 200000
    step: 1
    mode: box
    unit_of_measurement: km
    icon: mdi:counter

script:
  inspektion_jetzt_abrufen:
    alias: Inspektionsdaten jetzt abrufen
    icon: mdi:cloud-refresh
    sequence:
      - action: hassio.addon_stdin
        data:
          addon: ADDON_SLUG
          input: refresh

automation:
  - id: inspektion_faelligkeit_melden
    alias: Inspektion bald fällig / überfällig melden
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.inspektion_ktm_status
          - sensor.inspektion_husqvarna_status
        to:
          - bald fällig
          - überfällig
    actions:
      - variables:
          fz: "{{ trigger.entity_id | replace('sensor.inspektion_', '') | replace('_status', '') }}"
          n: "{{ 'sensor.inspektion_' ~ fz ~ '_naechste' }}"
      - action: persistent_notification.create
        data:
          notification_id: "inspektion_{{ fz }}"
          title: "🔧 {{ state_attr(n, 'friendly_name') | replace(' – nächste Inspektion', '') }}: Inspektion {{ trigger.to_state.state }}"
          message: >-
            Fällig am {{ as_timestamp(states(n)) | timestamp_custom('%d.%m.%Y') }}
            {%- if state_attr(n, 'tage_bis') is not none %} (in {{ state_attr(n, 'tage_bis') }} Tagen){% endif %}
            {%- if state_attr(n, 'faellig_bei_km') is not none %} bzw. bei {{ state_attr(n, 'faellig_bei_km') }} km{% endif %}.

  - id: inspektion_rueckruf_melden
    alias: Offenen Rückruf melden
    triggers:
      - trigger: state
        entity_id:
          - sensor.inspektion_ktm_status
          - sensor.inspektion_husqvarna_status
        attribute: rueckruf_offen
        to: true
    actions:
      - action: persistent_notification.create
        data:
          notification_id: "inspektion_rueckruf_{{ trigger.entity_id }}"
          title: "⚠️ Rückruf / Sicherheitsupdate"
          message: "{{ trigger.to_state.attributes.friendly_name }}: offener Rückruf – bitte Händler kontaktieren."

  - id: inspektion_abruf_fehler_melden
    alias: Fehler beim Inspektionsabruf melden
    triggers:
      - trigger: state
        entity_id:
          - sensor.inspektion_ktm_status
          - sensor.inspektion_husqvarna_status
        attribute: fehler
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.attributes.fehler not in [none, ''] }}"
    actions:
      - action: persistent_notification.create
        data:
          notification_id: "inspektion_fehler_{{ trigger.entity_id }}"
          title: "Inspektionsabruf fehlgeschlagen"
          message: "{{ trigger.to_state.attributes.friendly_name }}: {{ trigger.to_state.attributes.fehler }}"

  - id: inspektion_roadside_melden
    alias: Roadside Assistance läuft bald ab
    triggers:
      - trigger: time
        at: "09:00:00"
    conditions:
      - condition: template
        value_template: >-
          {% set bis = state_attr('sensor.inspektion_husqvarna_letzte', 'roadside_assistance_bis') %}
          {{ bis is not none and ((as_timestamp(bis) - as_timestamp(today_at())) / 86400) | round(0) | int == 30 }}
    actions:
      - action: persistent_notification.create
        data:
          notification_id: inspektion_roadside
          title: "🛟 Roadside Assistance läuft ab"
          message: >-
            Husqvarna: Roadside Assistance aktiv bis
            {{ as_timestamp(state_attr('sensor.inspektion_husqvarna_letzte', 'roadside_assistance_bis')) | timestamp_custom('%d.%m.%Y') }}.
            Zur Verlängerung bitte den Händler kontaktieren.
